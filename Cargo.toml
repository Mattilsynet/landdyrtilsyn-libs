[workspace]
members = ["lib-keycloak-client", "lib-auth", "lib-google-cloud-storage", "lib-sql", "lib-nats", "lib-clients", "lib-schemas", "lib-slack-notifier", "lib-entra", "lib-email", "lib-mt-ansatte"]
resolver = "3"

[workspace.dependencies]
async-nats = "0.51.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
secrecy = "0.10.3"
tracing = "0.1.44"
thiserror = "2.0.21"
reqwest = { version = "0.13.5", features = ["json","rustls", "form", "http2"], default-features = false }
reqwest-retry = "0.9.1"
reqwest-middleware = { version = "0.5.2", features = ["json", "form"] }

chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4"] }
bytes = "1.12.1"
anyhow = "1.0.104"

tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

base64 = "0.23.1"

# RUSTSEC-2026-0099, RUSTSEC-2026-0382
rustls-webpki = "0.103.16"
