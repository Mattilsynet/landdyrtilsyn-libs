[package]
name = "lib-sql"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
secrecy = { workspace = true }
sqlx-core = { version = "0.9.1", default-features = false, features = [
    "_rt-tokio",
    "_tls-rustls-ring-webpki",
    "migrate",
    "uuid",
    "chrono",
] }
sqlx-postgres = { version = "0.9.1", default-features = false, features = [
    "migrate",
    "uuid",
    "chrono",
] }


[lints.rust]
unsafe_code = "forbid"  # Disallow unsafe code
missing_docs = "warn"   # Warn if public items lack documentation

[lints.clippy]
pedantic = "warn"       # Enable Clippy’s strictest rules
unwrap_used = "deny"    # Disallow `unwrap()`
